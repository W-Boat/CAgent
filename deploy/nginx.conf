server {
    listen 80;
    server_name _;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # SPA 路由 + 分享卡片。
    #
    # 原先的 `try_files $uri $uri/ /index.html` 里，`$uri/` 有个副作用：
    # 磁盘上存在同名**目录**时，nginx 会对 `/login` 发 301 跳到 `/login/`。
    # 而构建期为了做微信分享卡片，恰好会生成 dist/login/index.html 这样的目录
    # —— 于是分享 `/login` 会先吃一次 301。微信对跳转链路容忍度不高，
    # 多一跳可能直接抓不到卡片。
    #
    # 改为**显式按目录找 index.html**：
    #   $uri                 命中真实文件（assets 等）
    #   $uri/index.html      命中预渲染页面（200，无跳转）
    #   /index.html          兜底回落到根页（SPA 内部路由照常工作）
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代（SSE 流式：关缓冲）
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    # 浏览器截图等产物（API 也在 /static 下暴露同一目录）
    location ^~ /static/answer-cache { return 404; }
    location ^~ /static/.private { return 404; }
    location /static/ {
        proxy_pass http://api:3001/static/;
        proxy_set_header Host $host;
    }
}
