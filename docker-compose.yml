services:
  db:
    image: postgres:16-alpine
    container_name: cagent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cagent
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: cagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cagent -d cagent"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cagent-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # 全部密钥从 .env 读取，避免逐个列出时漏项
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cagent:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/cagent?schema=public
      API_PORT: "3001"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      # 服务器端不跑浏览器：网页操控由用户本地浏览器执行（前端 localtools）
      # 后端只做「审批 + 留痕 + 转发指令」，因此这里保持禁用
      BROWSER_CLIENT_SIDE: "true"
    volumes:
      - storage:/app/apps/api/storage

  web:
    image: nginx:alpine
    container_name: cagent-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  storage:
